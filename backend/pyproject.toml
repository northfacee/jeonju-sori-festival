[project]
name = "jeonju-sori-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "태민", email = "jkgjms3@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.3",
    "langgraph>=1.2.11",
